services:
  console:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TRADER_DB: /app/runtime/trader.db
      ALPACA_PAPER_KEY: ${ALPACA_PAPER_KEY:-}
      ALPACA_PAPER_SECRET: ${ALPACA_PAPER_SECRET:-}
      ALPACA_LIVE_KEY: ${ALPACA_LIVE_KEY:-}
      ALPACA_LIVE_SECRET: ${ALPACA_LIVE_SECRET:-}
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-4002}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-31}
      IBKR_ACCOUNT: ${IBKR_ACCOUNT:-}
      IBKR_CONNECTED_VERIFIED: ${IBKR_CONNECTED_VERIFIED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - trader-state:/app/runtime
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  trader-state:
